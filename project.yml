name: MagicCamera
options:
  bundleIdPrefix: com.keks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team ID (confirmed by the user). Applies to app + widget.
    DEVELOPMENT_TEAM: "8Y755TXDN8"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      # Device quality testing runs Debug builds, and -Onone makes the scan /
      # mesh hot loops 10-30× slower than release (measured: 1M-pt bilateral
      # denoise 55 s vs 1.8 s) — slow enough to trip the 90 s CPU watchdog on
      # code that ships fine. Optimize Debug too; incremental mode keeps
      # rebuild times close to before. Trade-off: assert() is compiled out and
      # lldb stepping degrades — acceptable, testing happens via Diagnostics.
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: incremental

targets:
  MagicCamera:
    type: application
    platform: iOS
    sources:
      - path: MagicCamera
        excludes:
          - "App/Info.plist"
          - "SpatialScan/Resources/**"
      # Bundled assets (e.g. the offline three.js runtime for the web viewer):
      # forced into the resources phase so Xcode never tries to compile them.
      - path: MagicCamera/SpatialScan/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keks.MagicCamera
        PRODUCT_NAME: MagicCamera
        INFOPLIST_FILE: MagicCamera/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MagicCamera/App/MagicCamera.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: MagicCamera/Support/BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/MagicCamera/LiveDepth/Shaders"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MTL_FAST_MATH: YES
    dependencies:
      # Embeds the WidgetKit extension into the app bundle.
      - target: MagicCameraWidget

  MagicCameraWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MagicCameraWidget
      # The App Group data contract, shared with the app target.
      - path: MagicCamera/Widget/WidgetShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keks.MagicCamera.Widget
        PRODUCT_NAME: MagicCameraWidget
        INFOPLIST_FILE: MagicCameraWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MagicCameraWidget/MagicCameraWidget.entitlements
        SKIP_INSTALL: YES

  MagicCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MagicCameraTests
    dependencies:
      - target: MagicCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keks.MagicCameraTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MagicCamera:
    build:
      targets:
        MagicCamera: all
        MagicCameraTests: [test]
    test:
      targets:
        - MagicCameraTests
